<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#05060f" />
  <meta name="robots" content="noindex" />
  <title>Wish_Received.VR — Link Builder</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%233ee6ff'/%3E%3Cstop%20offset='.55'%20stop-color='%238b5cf6'/%3E%3Cstop%20offset='1'%20stop-color='%23ff4fd8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20x='3'%20y='3'%20width='58'%20height='58'%20rx='14'%20fill='%23070b18'/%3E%3Crect%20x='3'%20y='3'%20width='58'%20height='58'%20rx='14'%20fill='none'%20stroke='url(%23g)'%20stroke-width='3'/%3E%3Ctext%20x='32'%20y='42'%20font-family='Arial,Helvetica,sans-serif'%20font-size='24'%20font-weight='800'%20text-anchor='middle'%20fill='url(%23g)'%3EVR%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/builder.css" />
</head>
<body class="builder-page">

  <div class="bg" aria-hidden="true">
    <div class="aurora-wrap">
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>
    <div class="grain"></div>
    <div class="vignette"></div>
  </div>

  <header class="chrome">
    <div class="chrome-brand mono" aria-hidden="true"><span class="hex"></span>VR&nbsp;DEVELOPMENTS</div>
    <a class="back-link mono" href="./">← WISH_RECEIVED.VR</a>
  </header>

  <main class="builder-stage">
    <div class="card glass builder-card">
      <p class="eyebrow mono">SENDER&nbsp;TOOL&nbsp;·&nbsp;FOR&nbsp;VOLAM&nbsp;RAKSHITH</p>
      <h1 class="builder-title">Personal Link&nbsp;Builder</h1>
      <p class="builder-sub">
        Generate one unique link per family member.
        Their name and relationship appear throughout their experience.
      </p>

      <div class="field">
        <label class="mono" for="inName">NAME</label>
        <input id="inName" type="text" maxlength="28" placeholder="e.g. Vijay / Amma / Nanna" autocomplete="off" spellcheck="false" />
      </div>

      <div class="field">
        <label class="mono" for="inRel">RELATION</label>
        <input id="inRel" type="text" maxlength="30" placeholder="e.g. Uncle / Mother / Father" autocomplete="off" spellcheck="false" />
      </div>

      <div class="chips mono" role="list" aria-label="Quick presets">
        <button type="button" class="chip" data-name="Amma" data-rel="Mother">Amma · Mother</button>
        <button type="button" class="chip" data-name="Nanna" data-rel="Father">Nanna · Father</button>
        <button type="button" class="chip" data-name="Akka" data-rel="Sister">Akka · Sister</button>
        <button type="button" class="chip" data-name="Anna" data-rel="Brother">Anna · Brother</button>
        <button type="button" class="chip" data-name="Ammamma" data-rel="Grandmother">Ammamma · Grandmother</button>
        <button type="button" class="chip" data-name="Thatha" data-rel="Grandfather">Thatha · Grandfather</button>
        <button type="button" class="chip" data-name="Vijay" data-rel="Uncle">Vijay · Uncle</button>
      </div>

      <div class="field">
        <label class="mono" for="outUrl">PERSONALISED LINK</label>
        <input id="outUrl" type="text" readonly />
      </div>

      <div class="builder-actions">
        <button class="btn btn-primary" id="copyBtn" type="button">COPY&nbsp;LINK</button>
        <button class="btn btn-ghost" id="openBtn" type="button">PREVIEW&nbsp;↗</button>
      </div>

      <p class="builder-note mono" id="copyNote">TIP&nbsp;·&nbsp;PASTE&nbsp;DIRECTLY&nbsp;INTO&nbsp;WHATSAPP&nbsp;—&nbsp;IT&nbsp;STAYS&nbsp;PERSONALISED</p>
    </div>
  </main>

  <script defer src="js/link-builder.js"></script>
</body>
</html>
